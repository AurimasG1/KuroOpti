name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: >-
        Server=127.0.0.1;
        Port=3306;
        Database=testdb;
        User=root;
        Password=root

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore KuroOpti.sln

      - name: Build solution
        run: >
          dotnet build KuroOpti.sln
          --configuration Release
          --no-restore

      - name: Run backend tests
        run: >
          dotnet test KuroOpti.sln
          --configuration Release
          --no-build
          --verbosity normal

      - name: Install EF Core CLI
        run: >
          dotnet tool install
          --global dotnet-ef
          --version 8.0.13

      - name: Check pending EF Core model changes
        run: >
          dotnet ef migrations has-pending-model-changes
          --project BackEnd/KuroOpti.Data
          --startup-project BackEnd/KuroOpti.API
          --configuration Release
          --no-build

  frontend:
    name: Frontend - Lint and Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  docker:
    name: Docker - Build Images
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker images
        run: docker compose build
